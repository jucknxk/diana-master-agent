name: Diana Auto Post

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # Node 24 support ပါဝင်သော နောက်ဆုံး version သို့ မြှင့်တင်ခြင်း
        uses: actions/checkout@v5 

      - name: Set up Python
        # Node 24 support ပါဝင်သော နောက်ဆုံး version သို့ မြှင့်တင်ခြင်း
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tweepy groq

      - name: Run Bot
        env:
          # Warning ရှင်းရန် force variable ကို ဖြုတ်လိုက်လို့ရပါပြီ (Version မြှင့်ပြီးသားမို့လို့)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python bot.py
